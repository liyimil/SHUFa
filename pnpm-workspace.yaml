packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@hono/node-server@1.19.11": "2.0.10"
  "fast-uri@3.1.3": "3.1.4"
  "brace-expansion": "5.0.8"
  "js-yaml@4.2.0": "4.3.0"
  "js-yaml@5.2.1": "5.2.2"
  "postcss@8.4.31": "8.5.19"
  "sharp@0.34.5": "0.35.3"
  "uuid@7.0.3": "11.1.1"
  "valibot@1.2.0": "1.4.2"

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.9"
  - "@expo/metro-config@57.0.6"
  - "@expo/prebuild-config@57.0.8"
  - "@nestjs/swagger@11.4.6"
  - "openapi-typescript@7.12.0"
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7
  - "@aws-sdk/client-s3@3.1090.0"
  - "@aws-sdk/s3-request-presigner@3.1090.0"
