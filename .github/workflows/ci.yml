name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm security:audit
      - run: pnpm contract:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @calligraphy/web exec playwright install --with-deps chromium
      - run: pnpm --filter @calligraphy/web e2e:ci
      - run: pnpm --filter @calligraphy/web audit:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/lighthouse-results
          retention-days: 7

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, ai, web, admin]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build
          --file infrastructure/docker/Dockerfile.${{ matrix.service }}
          --tag calligraphy-${{ matrix.service }}:${{ github.sha }}
          .
